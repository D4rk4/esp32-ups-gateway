name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      PLATFORMIO_SETTING_ENABLE_TELEMETRY: 'no'
      CXX: g++-14
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Check version and release notes
        id: version
        run: |
          version=$(python -c 'from pathlib import Path; from tools.flash import firmware_version; print(firmware_version(Path(".")))')
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" != "v$version" ]]; then
            printf 'Tag %s does not match firmware version v%s\n' "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi
          if [[ ! -f "docs/releases/$version.md" ]]; then
            printf 'Missing release notes: docs/releases/%s.md\n' "$version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m platformio pkg install -e esp32-poe-16mb
      - name: Run checks
        run: |
          python tools/embed_web.py
          python tools/test_host.py
          python tools/test_host.py --sanitize
          python tools/test_event_bus.py
          python tests/http_adapter/run.py
          python tests/web_ui_check.py
          node tests/ui_fixture_contract_check.js
          python -m unittest discover -s tests -p 'test_*.py'
          python tools/make_ui_fixture.py
          git diff --exit-code -- tests/ui_fixture.html
      - name: Build flashable images
        run: |
          python tools/build.py
          for file in firmware.bin bootloader.bin partitions.bin SHA256SUMS.txt build-info.json; do
            test -s "firmware/$file"
          done
      - name: Upload build outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-images
          if-no-files-found: error
          path: |
            firmware/firmware.bin
            firmware/bootloader.bin
            firmware/partitions.bin
            firmware/SHA256SUMS.txt
            firmware/build-info.json

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-images
          path: firmware
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            firmware/firmware.bin firmware/bootloader.bin firmware/partitions.bin \
            firmware/SHA256SUMS.txt firmware/build-info.json \
            --title "ESP32 UPS Gateway $VERSION" \
            --notes-file "docs/releases/$VERSION.md" \
            --verify-tag
